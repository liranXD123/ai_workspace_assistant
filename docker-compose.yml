version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: workspace_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always

  web_app:
    build: .
    container_name: workspace_app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    devices:
      - "/dev/video0:/dev/video0"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_storage: